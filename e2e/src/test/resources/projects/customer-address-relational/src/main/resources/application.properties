quarkus.application.name=customer-address-relational

# --- datasource: Dev Services (Testcontainers) in dev/test; env vars in prod ---
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:admin123}
# use docker-compose.yml instead of Dev Services: ./mvnw quarkus:dev -Dquarkus.profile=dev,compose
%compose.quarkus.datasource.devservices.enabled=false
%compose.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/app
%compose.quarkus.datasource.username=postgres
%compose.quarkus.datasource.password=admin123

# --- schema ---
# dev/test: Hibernate drop-and-create + data.sql (like Spring Boot ddl-auto + data.sql)
# prod: Flyway migrations (src/main/resources/db/migration), Hibernate only validates
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.flyway.migrate-at-start=false
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.packages=io.example.orders
# @json columns: Hibernate's own JSON mapping, not the REST ObjectMapper
quarkus.hibernate-orm.mapping.format.global=ignore

# --- kafka: Dev Services (Redpanda) in dev/test ---
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
%compose.quarkus.kafka.devservices.enabled=false
%compose.kafka.bootstrap.servers=localhost:9092

# --- channels from src/main/resources/public/apis/asyncapi.yml ---
mp.messaging.outgoing.customerEventsChannel.connector=smallrye-kafka
mp.messaging.outgoing.customerEventsChannel.topic=customer-events
mp.messaging.incoming.customerCommandsChannel.connector=smallrye-kafka
mp.messaging.incoming.customerCommandsChannel.topic=customer-commands
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi

# random port for @QuarkusTest
quarkus.http.test-port=0

# seed data for tests (src/test/resources/data.sql)
%test.quarkus.hibernate-orm.sql-load-script=data.sql
%dev.quarkus.hibernate-orm.sql-load-script=no-file
%test.quarkus.hibernate-orm.log.sql=false
# failed commands go to dead-letter-topic-customerCommandsChannel; the consumer keeps running
mp.messaging.incoming.customerCommandsChannel.failure-strategy=dead-letter-queue
# tests send commands right after boot, before the consumer group is assigned
%test.mp.messaging.incoming.customerCommandsChannel.auto.offset.reset=earliest
