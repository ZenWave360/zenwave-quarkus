quarkus.application.name=customer-address-relational

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=app
quarkus.datasource.password=app
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.packages=io.example.orders

kafka.bootstrap.servers=localhost:9092
mp.messaging.outgoing.customerEventsChannel.connector=smallrye-kafka
mp.messaging.outgoing.customerEventsChannel.topic=customer-events-topic
mp.messaging.outgoing.customerEventChannel.connector=smallrye-kafka
mp.messaging.outgoing.customerEventChannel.topic=customer-events-topic
mp.messaging.incoming.createCustomerChannel.connector=smallrye-kafka
mp.messaging.incoming.createCustomerChannel.topic=customer-input-topic
mp.messaging.incoming.customerCommandsChannel.connector=smallrye-kafka
mp.messaging.incoming.customerCommandsChannel.topic=customer-input-topic
